    <style>
/* ------------------------------------------------------------------
   Tokens
   Type system: serif carries Swedish, sans carries English.
   ------------------------------------------------------------------ */

:root {
  --bg: #f0eee6;
  --surface: #faf9f5;
  --surface-2: #f4f2ea;
  --ink: #1a1915;
  --ink-2: #57544c;
  --ink-3: #8c887c;
  --line: #dfdbcf;
  --line-strong: #cdc8b8;
  --accent: #d97757;
  --accent-ink: #b1543a;
  --accent-soft: #f7e7df;

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --measure: 46rem;
  --radius: 12px;
  --radius-sm: 8px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262624;
    --surface: #2e2e2b;
    --surface-2: #323230;
    --ink: #f3f1e9;
    --ink-2: #b3afa4;
    --ink-3: #8a867b;
    --line: #3e3e39;
    --line-strong: #4c4c46;
    --accent: #e08a6b;
    --accent-ink: #eda88c;
    --accent-soft: #3a2d27;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--accent-ink);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 3px;
}

.wrap {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 0 1.25rem 5rem;
}

/* ------------------------------------------------------------------
   Masthead
   ------------------------------------------------------------------ */

.masthead {
  padding: 4.5rem 0 2rem;
}

.eyebrow {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 1rem;
}

.masthead h1 {
  font-family: var(--serif);
  font-size: clamp(2.2rem, 7vw, 3.1rem);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0 0 0.6rem;
}

.masthead h1 em {
  font-style: italic;
  color: var(--accent);
}

.masthead p {
  max-width: 34rem;
  margin: 0;
  color: var(--ink-2);
}

/* ------------------------------------------------------------------
   What's-new callout
   ------------------------------------------------------------------ */

.callout {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin: 1.5rem 0 0;
}

.callout-body {
  flex: 1;
}

.callout-eyebrow {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 0.25rem;
}

.callout-text {
  margin: 0;
  font-size: 0.9rem;
  color: var(--ink-2);
}

.callout-dismiss {
  font: inherit;
  font-size: 0.8rem;
  white-space: nowrap;
  padding: 0.45rem 0.9rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.18s, color 0.18s;
}

.callout-dismiss:hover {
  border-color: var(--ink-3);
}

/* ------------------------------------------------------------------
   Section tabs
   ------------------------------------------------------------------ */

.tabs {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin: 2rem 0 1.25rem;
}

.tab {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}

.tab:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.tab.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tab.is-disabled {
  cursor: not-allowed;
  opacity: 0.75;
}

.tab.is-disabled:hover {
  border-color: var(--line);
  color: var(--ink-2);
}

.tab-soon {
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ------------------------------------------------------------------
   Progress
   ------------------------------------------------------------------ */

.progress {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0 0 2rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2rem;
}

.progress-track {
  flex: 1;
  height: 3px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-label {
  font-size: 0.8rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.progress button {
  font: inherit;
  font-size: 0.8rem;
  background: none;
  border: none;
  padding: 0;
  color: var(--ink-3);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.progress button:hover {
  color: var(--accent-ink);
}

/* ------------------------------------------------------------------
   Lesson cards
   ------------------------------------------------------------------ */

.card-list {
  display: grid;
  gap: 0.85rem;
  margin: 0 0 2.5rem;
  padding: 0;
  list-style: none;
}

.card {
  display: grid;
  grid-template-columns: 2.4rem 1fr auto;
  gap: 0 1rem;
  align-items: start;
  width: 100%;
  text-align: left;
  padding: 1.4rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.2s, transform 0.2s, background 0.2s;
}

a.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}

.card.is-locked {
  opacity: 0.72;
  cursor: default;
}

.card-num {
  font-family: var(--serif);
  font-size: 1.6rem;
  line-height: 1;
  color: var(--ink-3);
  padding-top: 0.15rem;
}

.card.done .card-num {
  color: var(--accent);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin-bottom: 0.3rem;
}

.card-theme {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
}

.card.is-locked .card-theme {
  color: var(--ink-3);
}

.badge-new {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  background: var(--accent);
  padding: 0.12rem 0.42rem;
  border-radius: 99px;
  line-height: 1.5;
}

.card h2 {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.25;
  margin: 0 0 0.4rem;
  letter-spacing: -0.01em;
}

.card-focus {
  font-size: 0.85rem;
  color: var(--ink-2);
  margin: 0;
}

.card-lock {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.75rem;
  font-size: 0.75rem;
  color: var(--ink-3);
}

.card-lock svg {
  width: 12px;
  height: 12px;
  flex: none;
}

.check {
  grid-column: 3;
  grid-row: 1;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: grid;
  place-items: center;
  margin-top: 0.35rem;
  flex: none;
}

.check svg {
  width: 12px;
  height: 12px;
  opacity: 0;
  transition: opacity 0.2s;
}

.card.done .check {
  background: var(--accent);
  border-color: var(--accent);
}

.card.done .check svg {
  opacity: 1;
  stroke: var(--surface);
}

.check.is-lock {
  border-color: var(--line-strong);
  background: transparent;
}

.check.is-lock svg {
  opacity: 1;
  width: 11px;
  height: 11px;
  stroke: var(--ink-3);
}

@media (prefers-color-scheme: dark) {
  .card.done .check svg {
    stroke: #262624;
  }
}

/* ------------------------------------------------------------------
   Lesson view
   ------------------------------------------------------------------ */

.back {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  margin: 2.5rem 0 2rem;
  font-size: 0.85rem;
  color: var(--ink-2);
  text-decoration: none;
}

.back:hover {
  color: var(--accent-ink);
}

.lesson-head {
  border-bottom: 1px solid var(--line);
  padding-bottom: 2rem;
  margin-bottom: 2rem;
}

.lesson-head h1 {
  font-family: var(--serif);
  font-size: clamp(1.9rem, 5.5vw, 2.5rem);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 0.6rem;
}

.lesson-head p {
  margin: 0;
  color: var(--ink-2);
  max-width: 34rem;
}

/* ------------------------------------------------------------------
   Theme switcher
   ------------------------------------------------------------------ */

.theme-switch {
  margin: 0 0 2.5rem;
}

.theme-switch-label {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: block;
  margin-bottom: 0.6rem;
}

.theme-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.theme-pill {
  font: inherit;
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.85rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}

.theme-pill:hover {
  border-color: var(--ink-3);
  color: var(--ink);
}

.theme-pill.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.theme-pill.is-complete:not(.is-active) {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.theme-pill-check {
  width: 13px;
  height: 13px;
  display: none;
}

.theme-pill-check svg {
  width: 13px;
  height: 13px;
}

.theme-pill.is-complete .theme-pill-check {
  display: inline-flex;
}

.theme-pill.is-active .theme-pill-check svg {
  stroke: #fff;
}

.theme-pill.is-complete:not(.is-active) .theme-pill-check svg {
  stroke: var(--accent);
}

.block-heading {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 3rem 0 1rem;
}

.prose {
  margin: 0 0 1.2rem;
  max-width: 36rem;
}

.note {
  border-left: 2px solid var(--accent);
  padding: 0.15rem 0 0.15rem 1.1rem;
  margin: 1.75rem 0;
  color: var(--ink-2);
  max-width: 36rem;
}

.note strong {
  color: var(--ink);
}

/* Rules list — numbering would imply sequence, so these are plain markers */
.rules {
  margin: 0 0 1.75rem;
  padding: 0;
  list-style: none;
  max-width: 38rem;
}

.rules-title {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 1.75rem 0 0.7rem;
}

.rules li {
  position: relative;
  padding-left: 1.1rem;
  margin-bottom: 0.55rem;
}

.rules li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.72em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

/* Tables */
.table-wrap {
  margin: 0 0 1.9rem;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--serif);
  font-size: 1rem;
}

th {
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: left;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

td {
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

tr:last-child td {
  border-bottom: none;
}

td b {
  font-weight: 600;
  color: var(--accent-ink);
}

.gloss {
  font-family: var(--sans);
  font-size: 0.78rem;
  color: var(--ink-3);
  display: block;
  line-height: 1.4;
}

.table-caption {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 0.7rem;
}

/* Example pairs — the signature: Swedish set large in serif, English tucked
   underneath in small sans. */
.examples {
  margin: 0 0 1.9rem;
  padding: 0;
  list-style: none;
}

.examples li {
  padding: 0.85rem 0 0.85rem 1.1rem;
  border-left: 1px solid var(--line);
}

.examples li:hover {
  border-left-color: var(--accent);
}

.sv {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.45;
  display: block;
}

.en {
  font-size: 0.85rem;
  color: var(--ink-3);
  display: block;
  margin-top: 0.15rem;
}

/* ------------------------------------------------------------------
   Exercises
   ------------------------------------------------------------------ */

.exercise {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin: 2rem 0;
}

.exercise-label {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 0.5rem;
}

.exercise-instruction {
  margin: 0 0 1.25rem;
  font-size: 0.92rem;
  color: var(--ink-2);
}

.q {
  margin-bottom: 1.1rem;
}

.q-prompt {
  font-family: var(--serif);
  font-size: 1.02rem;
  display: block;
  margin-bottom: 0.4rem;
}

.q-row {
  display: flex;
  gap: 0.6rem;
  align-items: center;
}

.q input {
  flex: 1;
  min-width: 0;
  font-family: var(--serif);
  font-size: 1rem;
  padding: 0.55rem 0.75rem;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
}

.q input::placeholder {
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 0.88rem;
}

.q.right input {
  border-color: var(--accent);
}

.q.wrong input {
  border-color: var(--line-strong);
}

.verdict {
  font-size: 0.95rem;
  width: 1.1rem;
  flex: none;
  color: var(--accent);
}

.solution {
  font-family: var(--serif);
  font-size: 0.95rem;
  color: var(--ink-2);
  margin-top: 0.4rem;
  padding-left: 0.1rem;
}

.solution span {
  font-family: var(--sans);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-right: 0.5rem;
}

.exercise-actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-top: 1.35rem;
}

/* ------------------------------------------------------------------
   Buttons
   ------------------------------------------------------------------ */

.btn {
  font: inherit;
  font-size: 0.88rem;
  padding: 0.55rem 1.1rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}

.btn:hover {
  border-color: var(--ink-3);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-ink);
  border-color: var(--accent-ink);
}

.btn-primary.is-done {
  background: transparent;
  color: var(--accent-ink);
}

/* ------------------------------------------------------------------
   Lesson footer
   ------------------------------------------------------------------ */

.lesson-foot {
  margin-top: 3.5rem;
  padding-top: 2rem;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.lesson-foot .next {
  font-size: 0.88rem;
  text-align: right;
}

.lesson-foot .next span {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.site-foot {
  margin-top: 4rem;
  font-size: 0.78rem;
  color: var(--ink-3);
}

@media (max-width: 34rem) {
  .masthead {
    padding-top: 3rem;
  }

  .card {
    grid-template-columns: 1.9rem 1fr auto;
    padding: 1.2rem 1.1rem;
  }

  .exercise {
    padding: 1.15rem;
  }

  .q-row {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }

  a.card:hover {
    transform: none;
  }
}

        white-space: nowrap;
        border: 0;

    <script>
(function () {
  "use strict";
  try {

/* ==================================================================
   Config
   ================================================================== */

// The five themes every lesson is available in. Completing a lesson in any
// one theme completes the lesson; the overview tracks how many themes deep
// you've gone.
const THEMES = ["Stardew Valley", "Animal Crossing", "Bunnies", "Japan", "Traveling"];

// Bump UPDATE_ID whenever there's something new to announce. The "what's new"
// callout reappears until the user dismisses this exact id.
const UPDATE_ID = "2026-07-animal-crossing";
const UPDATE_TEXT =
  "The latest update adds a new lesson theme — <strong>Animal Crossing</strong>. Open any lesson and switch themes to try it.";

// Sections group lessons by level. Only "beginner" has content for now; the
// rest are visible but disabled so the shape of what's coming is clear.
const sections = [
  { id: "beginner", label: "Beginner", enabled: true },
  { id: "intermediate", label: "Intermediate", enabled: false },
  { id: "advanced", label: "Advanced", enabled: false },
];

/* ==================================================================
   Block builders
   Each lesson keeps its grammar explanation once and swaps only the
   themed vocabulary, sentences and exercises per theme.
   ================================================================== */

function nounTable(caption, rows) {
  return {
    type: "table",
    caption,
    headers: ["Indefinite", "Definite", "Plural", "Definite plural"],
    rows,
  };
}

function examplesBlock(items) {
  return { type: "examples", items };
}

function exercise(instruction, items) {
  return { type: "exercise", instruction, items };
}

function verbTable(t) {
  const rows = [];
  t.arVerbs.forEach((v, i) => rows.push([i === 0 ? "<b>-ar verbs</b>" : "", v[0], v[1], v[2]]));
  t.erVerbs.forEach((v, i) => rows.push([i === 0 ? "<b>-er verbs</b>" : "", v[0], v[1], v[2]]));
  t.shortVerbs.forEach((v, i) => rows.push([i === 0 ? "<b>short verbs</b>" : "", v[0], v[1], v[2]]));
  rows.push(["<b>irregular</b>", "vara", "är", "be"]);
  rows.push(["", "ha", "har", "have"]);
  return { type: "table", headers: ["Group", "Infinitive", "Present", "Meaning"], rows };
}

          ["Mina biljetter är dyra.", "My tickets are expensive."],
          ["Är det ditt hotell?", "Is that your hotel?"],
          ["Jag reser med dem.", "I travel with them."],
        ],
        drill: [
          { q: "___ väska (min)", answer: "min väska" },
          { q: "___ pass (min)", answer: "mitt pass" },
          { q: "___ biljetter (min)", answer: "mina biljetter" },
          { q: "___ hotell (din)", answer: "ditt hotell" },
          { q: "___ resor (din)", answer: "dina resor" },
        ],
        translate: [
          { q: "My bag is heavy.", answer: "Min väska är tung." },
          { q: "Is that your hotel?", answer: "Är det ditt hotell?" },
          { q: "I travel with them.", answer: "Jag reser med dem." },
        ],
      },
    },
    build(t, themeName) {
      return [
        {
          type: "prose",
          text: "Swedish pronouns are refreshingly regular. The <strong>subject</strong> form does the acting; the <strong>object</strong> form receives it — and possessives agree with the thing owned, exactly like adjectives.",
        },
        { type: "heading", text: "Personal pronouns" },
        {
          type: "table",
          headers: ["Subject", "Object", "Meaning"],
          rows: [
            ["jag", "mig", "I / me"],
            ["du", "dig", "you <span class=gloss>one person</span>"],
            ["han", "honom", "he / him"],
            ["hon", "henne", "she / her"],
            ["den / det", "den / det", "it <span class=gloss>en / ett</span>"],
            ["vi", "oss", "we / us"],
            ["ni", "er", "you <span class=gloss>several</span>"],
            ["de", "dem", "they / them"],
          ],
        },
        {
          type: "note",
          text: "<em>de</em> and <em>dem</em> are both said “dom” out loud, but keep them apart in writing: <em>de</em> is the subject, <em>dem</em> the object.",
        },
        { type: "heading", text: "Possessives" },
        {
          type: "prose",
          text: "“My”, “your” and “our” change form to match the noun they sit in front of — en-word, ett-word or plural — just like adjectives do.",
        },
        {
          type: "table",
          headers: ["", "en-word", "ett-word", "plural"],
          rows: [
            ["my", "min", "mitt", "mina"],
            ["your <span class=gloss>sg</span>", "din", "ditt", "dina"],
            ["our", "vår", "vårt", "våra"],
            ["your <span class=gloss>pl</span>", "er", "ert", "era"],
          ],
        },
        {
          type: "note",
          text: "<em>hans</em> (his), <em>hennes</em> (her), <em>dess</em> (its) and <em>deras</em> (their) never change: <em>hans</em> bil, <em>hennes</em> hus, <em>deras</em> barn.",
        },
        { type: "heading", text: themeName + " in practice" },
        examplesBlock(t.examples),
        exercise("Choose the right form: min, mitt or mina.", t.drill),
        exercise("Translate into Swedish.", t.translate),

];

const app = document.getElementById("app");

/* ==================================================================
   Storage
   localStorage is the store; if it's unavailable (private mode, an
   embedded preview) we fall back to memory so nothing breaks.
   ================================================================== */

const K_PROGRESS = "swedish-grammar:progress"; // { lessonId: [themeName, ...] }
const K_SEEN = "swedish-grammar:seen"; // [lessonId, ...]
const K_THEME = "swedish-grammar:theme"; // { lessonId: themeName }
const K_CALLOUT = "swedish-grammar:callout"; // dismissed UPDATE_ID

const store = {
  mem: {},
  read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw != null) return JSON.parse(raw);
      return key in this.mem ? this.mem[key] : fallback;
    } catch {
      return key in this.mem ? this.mem[key] : fallback;
    }
  },
  write(key, val) {
    this.mem[key] = val;
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch {
      /* memory fallback already updated */
    }
  },
};

/* --- progress (per theme) --- */
function progressMap() {
  return store.read(K_PROGRESS, {});
}
function themesDone(id) {
  return progressMap()[id] || [];
}
function lessonDone(id) {
  return themesDone(id).length > 0;
}
function themeDone(id, theme) {
  return themesDone(id).includes(theme);
}
function toggleTheme(id, theme) {
  const p = progressMap();
  const arr = p[id] || [];
  p[id] = arr.includes(theme) ? arr.filter((x) => x !== theme) : [...arr, theme];
  store.write(K_PROGRESS, p);
  return p[id].includes(theme);
}

/* --- seen lessons (drives the "New" badge) --- */
function isSeen(id) {
  return store.read(K_SEEN, []).includes(id);
}
function markSeen(id) {
  const s = store.read(K_SEEN, []);
  if (!s.includes(id)) store.write(K_SEEN, [...s, id]);
}

/* --- selected theme per lesson --- */
function selectedTheme(id) {
  const t = store.read(K_THEME, {});
  return t[id] && THEMES.includes(t[id]) ? t[id] : THEMES[0];
}
function setSelectedTheme(id, theme) {
  const t = store.read(K_THEME, {});
  t[id] = theme;
  store.write(K_THEME, t);
}

/* --- prerequisites --- */
function isLocked(lesson) {
  return (lesson.requires || []).some((r) => !lessonDone(r));
}
function lockNames(lesson) {
  return (lesson.requires || []).map((r) => {
    const l = lessons.find((x) => x.id === r);
    return l ? l.short : r;
  });
}

/* ==================================================================
   Helpers
   ================================================================== */

const CHECK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>';

const LOCK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3.3" y="7" width="9.4" height="6.6" rx="1.3"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';

let activeSection = "beginner";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function joinNames(names) {
  if (names.length <= 1) return names.join("");
  if (names.length === 2) return names[0] + " and " + names[1];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

// Forgiving comparison: case, punctuation, spacing and accents are ignored, so
// "kon ar stor" is accepted from a keyboard without å ä ö.
function normalise(s) {
  return s
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[.,!?;:]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* ==================================================================
   Overview
   ================================================================== */

function renderOverview() {
  const section = sections.find((s) => s.id === activeSection) || sections[0];
  const sectionLessons = lessons.filter((l) => l.section === section.id);
  const doneCount = sectionLessons.filter((l) => lessonDone(l.id)).length;
  const anyProgress = lessons.some((l) => lessonDone(l.id));
  const pct = sectionLessons.length ? Math.round((doneCount / sectionLessons.length) * 100) : 0;
  const showCallout = store.read(K_CALLOUT, "") !== UPDATE_ID;

  app.innerHTML = `
    <header class="masthead">
      <p class="eyebrow">Grammar for beginners</p>
      <h1>Swedish, on <em>your</em> terms</h1>
      <p>Short, focused Swedish grammar lessons built around vocabulary you actually
      care about. Pick a lesson, choose a theme, and practise as you go.</p>
    </header>

    ${
      showCallout
        ? `<div class="callout" role="status">
             <div class="callout-body">
               <p class="callout-eyebrow">What’s new</p>
               <p class="callout-text">${UPDATE_TEXT}</p>
             </div>
             <button type="button" class="callout-dismiss" id="dismiss-callout">Got it</button>
           </div>`
        : ""
    }

    <div class="tabs" role="tablist" aria-label="Levels">
      ${sections
        .map((s) =>
          s.enabled
            ? `<button type="button" class="tab ${s.id === activeSection ? "is-active" : ""}"
                 role="tab" aria-selected="${s.id === activeSection}" data-section="${s.id}">
                 ${s.label}
               </button>`
            : `<span class="tab is-disabled" role="tab" aria-disabled="true">
                 ${s.label}<span class="tab-soon">Coming soon</span>
               </span>`
        )
        .join("")}
    </div>

    <div class="progress">
      <div class="progress-track" role="progressbar" aria-valuenow="${doneCount}"
           aria-valuemin="0" aria-valuemax="${sectionLessons.length}"
           aria-label="Lessons completed">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <p class="progress-label">${doneCount} of ${sectionLessons.length} done</p>
      ${anyProgress ? '<button type="button" id="reset">Reset</button>' : ""}
    </div>

    <ul class="card-list">
      ${sectionLessons.map(renderCard).join("")}
    </ul>
  `;

  const dismiss = document.getElementById("dismiss-callout");
  if (dismiss) {
    dismiss.addEventListener("click", () => {
      store.write(K_CALLOUT, UPDATE_ID);
      renderOverview();
    });
  }

  app.querySelectorAll("[data-section]").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeSection = btn.dataset.section;
      renderOverview();
    });
  });

  const reset = document.getElementById("reset");
  if (reset) {
    reset.addEventListener("click", () => {
      store.write(K_PROGRESS, {});
      renderOverview();
    });
  }
}

function renderCard(lesson) {
  const locked = isLocked(lesson);
  const done = lessonDone(lesson.id);
  const count = themesDone(lesson.id).length;
  const isNew = !locked && !isSeen(lesson.id);

  const meta = `
    <span class="card-meta">
      <span class="card-theme">${count} of ${THEMES.length} themes</span>
      ${isNew ? '<span class="badge-new">New</span>' : ""}
    </span>
  `;

  const checkSlot = locked
    ? `<span class="check is-lock" aria-hidden="true">${LOCK_SVG}</span>`
    : `<span class="check" aria-hidden="true">${CHECK_SVG}</span>`;

  const body = `
    <span class="card-num">${lesson.number}</span>
    <span>
      ${meta}
      <h2>${lesson.title}</h2>
      <p class="card-focus">${esc(lesson.focus)}</p>
      ${
        locked
          ? `<span class="card-lock">${LOCK_SVG}<span>Complete ${joinNames(
              lockNames(lesson)
            )} to unlock</span></span>`
          : ""
      }
    </span>
    ${checkSlot}
    <span class="sr-only">${locked ? "Locked" : done ? "Completed" : "Not started"}</span>
  `;

  if (locked) {
    return `<li><div class="card is-locked" aria-disabled="true">${body}</div></li>`;
  }
  return `<li><a class="card ${done ? "done" : ""}" href="#/${lesson.id}">${body}</a></li>`;
}

/* ==================================================================
   Lesson
   ================================================================== */

function renderLesson(lesson) {
  markSeen(lesson.id);

  const theme = selectedTheme(lesson.id);
  const themeData = lesson.themes[theme];
  const idx = lessons.indexOf(lesson);
  const next = lessons[idx + 1];
  const nextAvailable = next && !isLocked(next) ? next : null;
  const done = themeDone(lesson.id, theme);
  const blocks = lesson.build(themeData, theme);

  app.innerHTML = `
    <a class="back" href="#/">← All lessons</a>

    <header class="lesson-head">
      <p class="eyebrow">Lesson ${lesson.number}</p>
      <h1>${lesson.title}</h1>
      <p>${esc(lesson.summary)}</p>
    </header>

    <div class="theme-switch" role="group" aria-label="Choose a theme">
      <span class="theme-switch-label">Theme</span>
      <div class="theme-pills">
        ${THEMES.map(
          (name) => `
          <button type="button"
                  class="theme-pill ${name === theme ? "is-active" : ""} ${
            themeDone(lesson.id, name) ? "is-complete" : ""
          }"
                  data-theme="${esc(name)}"
                  aria-pressed="${name === theme}">
            <span class="theme-pill-check" aria-hidden="true">${CHECK_SVG}</span>${esc(name)}
          </button>`
        ).join("")}
      </div>
    </div>

    ${blocks.map(renderBlock).join("")}

    <div class="lesson-foot">
      <button type="button" class="btn btn-primary ${done ? "is-done" : ""}" id="mark">
        ${done ? "Completed ✓" : "Mark as completed"}
      </button>
      ${
        nextAvailable
          ? `<a class="next" href="#/${nextAvailable.id}"><span>Next</span>${nextAvailable.title} →</a>`
          : `<a class="next" href="#/"><span>Done</span>Back to overview →</a>`
      }
    </div>
  `;

  app.querySelectorAll("[data-theme]").forEach((btn) => {
    btn.addEventListener("click", () => {
      setSelectedTheme(lesson.id, btn.dataset.theme);
      renderLesson(lesson);
    });
  });

  document.getElementById("mark").addEventListener("click", (e) => {
    const cur = selectedTheme(lesson.id);
    const nowDone = toggleTheme(lesson.id, cur);
    e.target.textContent = nowDone ? "Completed ✓" : "Mark as completed";
    e.target.classList.toggle("is-done", nowDone);
    const pill = app.querySelector('[data-theme="' + cur + '"]');
    if (pill) pill.classList.toggle("is-complete", nowDone);
  });

  wireExercises();
  window.scrollTo(0, 0);
}

function renderBlock(block, i) {
  switch (block.type) {
    case "heading":
      return `<h2 class="block-heading">${block.text}</h2>`;

    case "prose":
      return `<p class="prose">${block.text}</p>`;

    case "note":
      return `<div class="note">${block.text}</div>`;

    case "rules":
      return `
        ${block.title ? `<p class="rules-title">${block.title}</p>` : ""}
        <ul class="rules">${block.items.map((x) => `<li>${x}</li>`).join("")}</ul>
      `;

    case "table":
      return `
        ${block.caption ? `<p class="table-caption">${block.caption}</p>` : ""}
        <div class="table-wrap">
          <table>
            <thead><tr>${block.headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
            <tbody>
              ${block.rows
                .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`)
                .join("")}
            </tbody>
          </table>
        </div>
      `;

    case "examples":
      return `
        <ul class="examples">
          ${block.items
            .map(
              ([sv, en]) =>
                `<li><span class="sv" lang="sv">${esc(sv)}</span><span class="en">${esc(
                  en
                )}</span></li>`
            )
            .join("")}
        </ul>
      `;

    case "exercise":
      return `
        <section class="exercise" data-exercise="${i}">
          <p class="exercise-label">Practice</p>
          <p class="exercise-instruction">${esc(block.instruction)}</p>
          ${block.items
            .map(
              (item, j) => `
            <div class="q" data-answer="${esc(item.answer)}">
              <label>
                <span class="q-prompt">${esc(item.q)}</span>
                <span class="q-row">
                  <input type="text" autocomplete="off" autocapitalize="off"
                         spellcheck="false" lang="sv"
                         placeholder="Your answer" aria-label="Answer ${j + 1}">
                  <span class="verdict" aria-live="polite"></span>
                </span>
              </label>
              <p class="solution" hidden><span>Answer</span>${esc(item.answer)}</p>
            </div>`
            )
            .join("")}
          <div class="exercise-actions">
            <button type="button" class="btn" data-action="check">Check answers</button>
            <button type="button" class="btn" data-action="reveal">Show answers</button>
          </div>
        </section>
      `;

    default:
      return "";
  }
}

function wireExercises() {
  app.querySelectorAll(".exercise").forEach((box) => {
    const questions = [...box.querySelectorAll(".q")];

    box.querySelector('[data-action="check"]').addEventListener("click", () => {
      questions.forEach((q) => {
        const input = q.querySelector("input");
        const verdict = q.querySelector(".verdict");
        if (!input.value.trim()) {
          q.classList.remove("right", "wrong");
          verdict.textContent = "";
          return;
        }
        const ok = normalise(input.value) === normalise(q.dataset.answer);
        q.classList.toggle("right", ok);
        q.classList.toggle("wrong", !ok);
        verdict.textContent = ok ? "✓" : "✗";
        if (!ok) q.querySelector(".solution").hidden = false;
      });
    });

    box.querySelector('[data-action="reveal"]').addEventListener("click", () => {
      questions.forEach((q) => {
        q.querySelector(".solution").hidden = false;
      });
    });

    // Enter checks the whole set, so you can drill without reaching for the mouse.
    box.querySelectorAll("input").forEach((input) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          box.querySelector('[data-action="check"]').click();
        }
      });
    });
  });
}

/* ==================================================================
   Router
   ================================================================== */

function route() {
  const id = location.hash.replace(/^#\/?/, "");
  const lesson = lessons.find((l) => l.id === id);
  if (lesson && !isLocked(lesson)) {
    document.title = `${lesson.title} · Swedish grammar`;
    renderLesson(lesson);
  } else {
    // Unknown or still-locked lesson falls back to the overview.
    document.title = "Swedish grammar for beginners";
    renderOverview();
  }
}

window.addEventListener("hashchange", route);
route();

  } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML =
      '<div class="boot-error"><h1>Something broke while loading</h1>' +
      '<p>Open the browser console for the details.</p><pre>' +
      String(err) + '</pre></div>';
  }
})();
