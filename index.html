<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swedish grammar for beginners</title>
    <meta
      name="description"
      content="Learn Swedish grammar through vocabulary you actually care about — pick a theme and practise nouns, verbs, adjectives and more."
    />
    <meta name="theme-color" content="#f0eee6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d97757'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' fill='%23fff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
/* ------------------------------------------------------------------
   Tokens
   Type system: serif carries Swedish, sans carries English.
   ------------------------------------------------------------------ */

:root {
  --bg: #f0eee6;
  --surface: #faf9f5;
  --surface-2: #f4f2ea;
  --ink: #1a1915;
  --ink-2: #57544c;
  --ink-3: #8c887c;
  --line: #dfdbcf;
  --line-strong: #cdc8b8;
  --accent: #d97757;
  --accent-ink: #b1543a;
  --accent-soft: #f7e7df;

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --measure: 46rem;
  --radius: 12px;
  --radius-sm: 8px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262624;
    --surface: #2e2e2b;
    --surface-2: #323230;
    --ink: #f3f1e9;
    --ink-2: #b3afa4;
    --ink-3: #8a867b;
    --line: #3e3e39;
    --line-strong: #4c4c46;
    --accent: #e08a6b;
    --accent-ink: #eda88c;
    --accent-soft: #3a2d27;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--accent-ink);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 3px;
}

.wrap {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 0 1.25rem 5rem;
}

/* ------------------------------------------------------------------
   Masthead
   ------------------------------------------------------------------ */

.masthead {
  padding: 4.5rem 0 2rem;
}

.eyebrow {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 1rem;
}

.masthead h1 {
  font-family: var(--serif);
  font-size: clamp(2.2rem, 7vw, 3.1rem);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0 0 0.6rem;
}

.masthead h1 em {
  font-style: italic;
  color: var(--accent);
}

.masthead p {
  max-width: 34rem;
  margin: 0;
  color: var(--ink-2);
}

/* ------------------------------------------------------------------
   What's-new callout
   ------------------------------------------------------------------ */

.callout {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin: 1.5rem 0 0;
}

.callout-body {
  flex: 1;
}

.callout-eyebrow {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 0.35rem;
}

.callout-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.callout-list li {
  position: relative;
  padding-left: 0.95rem;
  font-size: 0.9rem;
  color: var(--ink-2);
}

.callout-list li + li {
  margin-top: 0.3rem;
}

.callout-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.72em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.callout-dismiss {
  font: inherit;
  font-size: 0.8rem;
  white-space: nowrap;
  padding: 0.45rem 0.9rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.18s, color 0.18s;
}

.callout-dismiss:hover {
  border-color: var(--ink-3);
}

/* ------------------------------------------------------------------
   Section tabs
   ------------------------------------------------------------------ */

.tabs {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin: 2rem 0 1.25rem;
}

.tab {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}

.tab:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.tab.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tab.is-disabled {
  cursor: not-allowed;
  opacity: 0.75;
}

.tab.is-disabled:hover {
  border-color: var(--line);
  color: var(--ink-2);
}

.tab-soon {
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ------------------------------------------------------------------
   Progress
   ------------------------------------------------------------------ */

.progress {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0 0 2rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2rem;
}

.progress-track {
  flex: 1;
  height: 3px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-label {
  font-size: 0.8rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.progress button {
  font: inherit;
  font-size: 0.8rem;
  background: none;
  border: none;
  padding: 0;
  color: var(--ink-3);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.progress button:hover {
  color: var(--accent-ink);
}

/* ------------------------------------------------------------------
   Lesson cards
   ------------------------------------------------------------------ */

.card-list {
  display: grid;
  gap: 0.85rem;
  margin: 0 0 2.5rem;
  padding: 0;
  list-style: none;
}

.card {
  display: grid;
  grid-template-columns: 2.4rem 1fr auto;
  gap: 0 1rem;
  align-items: start;
  width: 100%;
  text-align: left;
  padding: 1.4rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.2s, transform 0.2s, background 0.2s;
}

a.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}

.card.is-locked {
  opacity: 0.72;
  cursor: default;
}

.card-num {
  font-family: var(--serif);
  font-size: 1.6rem;
  line-height: 1;
  color: var(--ink-3);
  padding-top: 0.15rem;
  white-space: nowrap;
}

.card-num-tag {
  font-size: 0.85rem;
  color: var(--accent);
  margin-left: 0.05em;
}

.card.done .card-num {
  color: var(--accent);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  flex-wrap: wrap;
  margin-bottom: 0.3rem;
}

.card-theme {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
}

.card.is-locked .card-theme {
  color: var(--ink-3);
}

.badge-new {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  background: var(--accent);
  padding: 0.12rem 0.42rem;
  border-radius: 99px;
  line-height: 1.5;
}

.badge-kind {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 0.1rem 0.42rem;
  border-radius: 99px;
  line-height: 1.5;
}

.card h2 {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.25;
  margin: 0 0 0.4rem;
  letter-spacing: -0.01em;
}

.card-focus {
  font-size: 0.85rem;
  color: var(--ink-2);
  margin: 0;
}

.card-lock {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.75rem;
  font-size: 0.75rem;
  color: var(--ink-3);
}

.card-lock svg {
  width: 12px;
  height: 12px;
  flex: none;
}

.check {
  grid-column: 3;
  grid-row: 1;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: grid;
  place-items: center;
  margin-top: 0.35rem;
  flex: none;
}

.check svg {
  width: 12px;
  height: 12px;
  opacity: 0;
  transition: opacity 0.2s;
}

.card.done .check {
  background: var(--accent);
  border-color: var(--accent);
}

.card.done .check svg {
  opacity: 1;
  stroke: var(--surface);
}

.check.is-lock {
  border-color: var(--line-strong);
  background: transparent;
}

.check.is-lock svg {
  opacity: 1;
  width: 11px;
  height: 11px;
  stroke: var(--ink-3);
}

@media (prefers-color-scheme: dark) {
  .card.done .check svg {
    stroke: #262624;
  }
}

/* ------------------------------------------------------------------
   Lesson view
   ------------------------------------------------------------------ */

.back {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  margin: 2.5rem 0 2rem;
  font-size: 0.85rem;
  color: var(--ink-2);
  text-decoration: none;
}

.back:hover {
  color: var(--accent-ink);
}

.lesson-head {
  border-bottom: 1px solid var(--line);
  padding-bottom: 2rem;
  margin-bottom: 2rem;
}

.lesson-head h1 {
  font-family: var(--serif);
  font-size: clamp(1.9rem, 5.5vw, 2.5rem);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 0.6rem;
}

.lesson-head p {
  margin: 0;
  color: var(--ink-2);
  max-width: 34rem;
}

/* ------------------------------------------------------------------
   Theme switcher
   ------------------------------------------------------------------ */

.theme-switch {
  margin: 0 0 2.5rem;
}

.theme-switch-label {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: block;
  margin-bottom: 0.6rem;
}

.theme-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.theme-pill {
  font: inherit;
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.85rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}

.theme-pill:hover {
  border-color: var(--ink-3);
  color: var(--ink);
}

.theme-pill.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.theme-pill.is-complete:not(.is-active) {
  border-color: var(--accent);
  color: var(--accent-ink);
}

.theme-pill-check {
  width: 13px;
  height: 13px;
  display: none;
}

.theme-pill-check svg {
  width: 13px;
  height: 13px;
}

.theme-pill.is-complete .theme-pill-check {
  display: inline-flex;
}

.theme-pill.is-active .theme-pill-check svg {
  stroke: #fff;
}

.theme-pill.is-complete:not(.is-active) .theme-pill-check svg {
  stroke: var(--accent);
}

.block-heading {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 3rem 0 1rem;
}

.prose {
  margin: 0 0 1.2rem;
  max-width: 36rem;
}

.note {
  border-left: 2px solid var(--accent);
  padding: 0.15rem 0 0.15rem 1.1rem;
  margin: 1.75rem 0;
  color: var(--ink-2);
  max-width: 36rem;
}

.note strong {
  color: var(--ink);
}

/* Rules list — numbering would imply sequence, so these are plain markers */
.rules {
  margin: 0 0 1.75rem;
  padding: 0;
  list-style: none;
  max-width: 38rem;
}

.rules-title {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 1.75rem 0 0.7rem;
}

.rules li {
  position: relative;
  padding-left: 1.1rem;
  margin-bottom: 0.55rem;
}

.rules li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.72em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

/* Tables */
.table-wrap {
  margin: 0 0 1.9rem;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--serif);
  font-size: 1rem;
}

th {
  font-family: var(--sans);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: left;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

td {
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

tr:last-child td {
  border-bottom: none;
}

td b {
  font-weight: 600;
  color: var(--accent-ink);
}

.gloss {
  font-family: var(--sans);
  font-size: 0.78rem;
  color: var(--ink-3);
  display: block;
  line-height: 1.4;
}

.table-caption {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 0.7rem;
}

/* Example pairs — the signature: Swedish set large in serif, English tucked
   underneath in small sans. */
.examples {
  margin: 0 0 1.9rem;
  padding: 0;
  list-style: none;
}

.examples li {
  padding: 0.85rem 0 0.85rem 1.1rem;
  border-left: 1px solid var(--line);
}

.examples li:hover {
  border-left-color: var(--accent);
}

.sv {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.45;
  display: block;
}

.en {
  font-size: 0.85rem;
  color: var(--ink-3);
  display: block;
  margin-top: 0.15rem;
}

/* ------------------------------------------------------------------
   Exercises
   ------------------------------------------------------------------ */

.exercise {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin: 2rem 0;
}

.exercise-label {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 0.5rem;
}

.exercise-instruction {
  margin: 0 0 1.25rem;
  font-size: 0.92rem;
  color: var(--ink-2);
}

.q {
  margin-bottom: 1.1rem;
}

.q-prompt {
  font-family: var(--serif);
  font-size: 1.02rem;
  display: block;
}

/* The vocabulary a question leans on, in the other language — the same quiet
   treatment the tables use for glosses. */
.q-gloss {
  font-size: 0.76rem;
  color: var(--ink-3);
  display: block;
  line-height: 1.45;
  margin: 0.1rem 0 0;
}

.q-row {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  margin-top: 0.4rem;
}

.q input {
  flex: 1;
  min-width: 0;
  font-family: var(--serif);
  font-size: 1rem;
  padding: 0.55rem 0.75rem;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
}

.q input::placeholder {
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 0.88rem;
}

.q.right input {
  border-color: var(--accent);
}

.q.wrong input {
  border-color: var(--line-strong);
}

.verdict {
  font-size: 0.95rem;
  width: 1.1rem;
  flex: none;
  color: var(--accent);
}

.solution {
  font-family: var(--serif);
  font-size: 0.95rem;
  color: var(--ink-2);
  margin-top: 0.4rem;
  padding-left: 0.1rem;
}

.solution span {
  font-family: var(--sans);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-right: 0.5rem;
}

.exercise-actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-top: 1.35rem;
}

/* ------------------------------------------------------------------
   Buttons
   ------------------------------------------------------------------ */

.btn {
  font: inherit;
  font-size: 0.88rem;
  padding: 0.55rem 1.1rem;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}

.btn:hover {
  border-color: var(--ink-3);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-ink);
  border-color: var(--accent-ink);
}

.btn-primary.is-done {
  background: transparent;
  color: var(--accent-ink);
}

/* ------------------------------------------------------------------
   Vocabulary lesson
   ------------------------------------------------------------------ */

.vocab-bar {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  flex-wrap: wrap;
  margin: 0 0 1.25rem;
}

.vocab-status {
  font-size: 0.8rem;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  flex: 1;
  min-width: 12rem;
  margin: 0;
}

.vocab-prompt {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.35rem 1.5rem;
  margin: 0 0 1.25rem;
  text-align: center;
}

.vocab-prompt-label {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: block;
  margin-bottom: 0.35rem;
}

.vocab-prompt-word {
  font-family: var(--serif);
  font-size: 1.75rem;
  line-height: 1.2;
  display: block;
  transition: opacity 0.18s;
}

.vocab-prompt.is-swap .vocab-prompt-word {
  opacity: 0;
}

.vocab-prompt-hint {
  font-size: 0.78rem;
  color: var(--ink-3);
  display: block;
  margin-top: 0.35rem;
  min-height: 1.2em;
}

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
  gap: 0.7rem;
  margin: 0 0 2rem;
  padding: 0;
  list-style: none;
}

/* `all: unset` strips the button chrome but leaves it shrink-to-fit, so the
   width has to be stated explicitly for aspect-ratio to resolve a height. */
.vocab-card {
  all: unset;
  display: block;
  box-sizing: border-box;
  width: 100%;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  perspective: 900px;
  -webkit-tap-highlight-color: transparent;
}

.vocab-inner {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;

/* ==================================================================
   Storage
   localStorage is the store; if it's unavailable (private mode, an
   embedded preview) we fall back to memory so nothing breaks.
   ================================================================== */

const K_PROGRESS = "swedish-grammar:progress"; // { lessonId: [themeName, ...] }
const K_SEEN = "swedish-grammar:seen"; // [lessonId, ...]
const K_THEME = "swedish-grammar:theme"; // { lessonId: themeName }
const K_CALLOUT = "swedish-grammar:callout"; // dismissed UPDATE_ID

const store = {
  mem: {},
  read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw != null) return JSON.parse(raw);
      return key in this.mem ? this.mem[key] : fallback;
    } catch {
      return key in this.mem ? this.mem[key] : fallback;
    }
  },
  write(key, val) {
    this.mem[key] = val;
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch {
      /* memory fallback already updated */
    }
  },
};

/* --- progress (per theme) --- */
function progressMap() {
  return store.read(K_PROGRESS, {});
}
function themesDone(id) {
  return progressMap()[id] || [];
}
function lessonDone(id) {
  return themesDone(id).length > 0;
}
function themeDone(id, theme) {
  return themesDone(id).includes(theme);
}
function setThemeDone(id, theme, done) {
  const p = progressMap();
  const arr = p[id] || [];
  const has = arr.includes(theme);
  if (done === has) return has;
  p[id] = done ? [...arr, theme] : arr.filter((x) => x !== theme);
  store.write(K_PROGRESS, p);
  return done;
}
function toggleTheme(id, theme) {
  return setThemeDone(id, theme, !themeDone(id, theme));
}

/* --- seen lessons (drives the "New" badge) --- */
function isSeen(id) {
  return store.read(K_SEEN, []).includes(id);
}
function markSeen(id) {
  const s = store.read(K_SEEN, []);
  if (!s.includes(id)) store.write(K_SEEN, [...s, id]);
}

/* --- selected theme per lesson --- */
function selectedTheme(id) {
  const t = store.read(K_THEME, {});
  return t[id] && THEMES.includes(t[id]) ? t[id] : THEMES[0];
}
function setSelectedTheme(id, theme) {
  const t = store.read(K_THEME, {});
  t[id] = theme;
  store.write(K_THEME, t);
}

/* --- prerequisites --- */
function lessonById(id) {
  return lessons.find((l) => l.id === id);
}

// A vocabulary lesson has no prerequisites of its own — it inherits whatever
// unlocks the grammar lesson it belongs to, and never gates anything itself.
function prereqs(lesson) {
  if (lesson.kind === "vocab") {
    const parent = lessonById(lesson.linkedTo);
    return parent ? parent.requires || [] : [];
  }
  return lesson.requires || [];
}

function isLocked(lesson) {
  return prereqs(lesson).some((r) => !lessonDone(r));
}

function lockNames(lesson) {
  return prereqs(lesson).map((r) => {
    const l = lessonById(r);
    return l ? l.short : r;
  });
}

// A vocabulary lesson borrows its themed word list from the grammar lesson it is
// paired with, so all five themes work with no duplicated vocabulary.
function themeDataFor(lesson, theme) {
  const source = lesson.kind === "vocab" ? lessonById(lesson.linkedTo) : lesson;
  return source.themes[theme];
}

/* ==================================================================
   Helpers
   ================================================================== */

const CHECK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>';

const LOCK_SVG =
  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3.3" y="7" width="9.4" height="6.6" rx="1.3"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';

let activeSection = "beginner";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function joinNames(names) {
  if (names.length <= 1) return names.join("");
  if (names.length === 2) return names[0] + " and " + names[1];
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

function shuffle(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// Forgiving comparison: case, punctuation, spacing and accents are ignored, so
// "kon ar stor" is accepted from a keyboard without å ä ö.
function normalise(s) {
  return s
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[.,!?;:]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* ==================================================================
   Overview
   ================================================================== */

function renderOverview() {
  const section = sections.find((s) => s.id === activeSection) || sections[0];
  const sectionLessons = lessons.filter((l) => l.section === section.id);
  const doneCount = sectionLessons.filter((l) => lessonDone(l.id)).length;
  const anyProgress = lessons.some((l) => lessonDone(l.id));
  const pct = sectionLessons.length ? Math.round((doneCount / sectionLessons.length) * 100) : 0;
  const showCallout = store.read(K_CALLOUT, "") !== UPDATE_ID;

  app.innerHTML = `
    <header class="masthead">
      <p class="eyebrow">Grammar for beginners</p>
      <h1>Swedish, on <em>your</em> terms</h1>
      <p>Short, focused Swedish grammar lessons built around vocabulary you actually
      care about. Pick a lesson, choose a theme, and practise as you go.</p>
    </header>

    ${
      showCallout
        ? `<div class="callout" role="status">
             <div class="callout-body">
               <p class="callout-eyebrow">What’s new</p>
               <ul class="callout-list">
                 ${UPDATE_ITEMS.map((x) => `<li>${x}</li>`).join("")}
               </ul>
             </div>
             <button type="button" class="callout-dismiss" id="dismiss-callout">Got it</button>
           </div>`
        : ""
    }

    <div class="tabs" role="tablist" aria-label="Levels">
      ${sections
        .map((s) =>
          s.enabled
            ? `<button type="button" class="tab ${s.id === activeSection ? "is-active" : ""}"
                 role="tab" aria-selected="${s.id === activeSection}" data-section="${s.id}">
                 ${s.label}
               </button>`
            : `<span class="tab is-disabled" role="tab" aria-disabled="true">
                 ${s.label}<span class="tab-soon">Coming soon</span>
               </span>`
        )
        .join("")}
    </div>

    <div class="progress">
      <div class="progress-track" role="progressbar" aria-valuenow="${doneCount}"
           aria-valuemin="0" aria-valuemax="${sectionLessons.length}"
           aria-label="Lessons completed">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <p class="progress-label">${doneCount} of ${sectionLessons.length} done</p>
      ${anyProgress ? '<button type="button" id="reset">Reset</button>' : ""}
    </div>

    <ul class="card-list">
      ${sectionLessons.map(renderCard).join("")}
    </ul>
  `;

  const dismiss = document.getElementById("dismiss-callout");
  if (dismiss) {
    dismiss.addEventListener("click", () => {
      store.write(K_CALLOUT, UPDATE_ID);
      renderOverview();
    });
  }

  app.querySelectorAll("[data-section]").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeSection = btn.dataset.section;
      renderOverview();
    });
  });

  const reset = document.getElementById("reset");
  if (reset) {
    reset.addEventListener("click", () => {
      store.write(K_PROGRESS, {});
      renderOverview();
    });
  }
}

function renderCard(lesson) {
  const locked = isLocked(lesson);
  const done = lessonDone(lesson.id);
  const count = themesDone(lesson.id).length;
  const isNew = !locked && !isSeen(lesson.id);

  const num =
    lesson.kind === "vocab"
      ? `${lesson.number}<span class="card-num-tag">V</span>`
      : `${lesson.number}`;

  const meta = `
    <span class="card-meta">
      <span class="card-theme">${count} of ${THEMES.length} themes</span>
      ${lesson.kind === "vocab" ? '<span class="badge-kind">Vocabulary</span>' : ""}
      ${isNew ? '<span class="badge-new">New</span>' : ""}
    </span>
  `;

  const checkSlot = locked
    ? `<span class="check is-lock" aria-hidden="true">${LOCK_SVG}</span>`
    : `<span class="check" aria-hidden="true">${CHECK_SVG}</span>`;

  const body = `
    <span class="card-num">${num}</span>
    <span>
      ${meta}
      <h2>${lesson.title}</h2>
      <p class="card-focus">${esc(lesson.focus)}</p>
      ${
        locked
          ? `<span class="card-lock">${LOCK_SVG}<span>Complete ${joinNames(
              lockNames(lesson)
            )} to unlock</span></span>`
          : ""
      }
    </span>
    ${checkSlot}
    <span class="sr-only">${locked ? "Locked" : done ? "Completed" : "Not started"}</span>
  `;

  if (locked) {
    return `<li><div class="card is-locked" aria-disabled="true">${body}</div></li>`;
  }
  return `<li><a class="card ${done ? "done" : ""}" href="#/${lesson.id}">${body}</a></li>`;
}

/* ==================================================================
   Lesson chrome shared by grammar and vocabulary lessons
   ================================================================== */

function themeSwitcherHTML(lesson, theme) {
  return `
    <div class="theme-switch" role="group" aria-label="Choose a theme">
      <span class="theme-switch-label">Theme</span>
      <div class="theme-pills">
        ${THEMES.map(
          (name) => `
          <button type="button"
                  class="theme-pill ${name === theme ? "is-active" : ""} ${
            themeDone(lesson.id, name) ? "is-complete" : ""
          }"
                  data-theme="${esc(name)}"
                  aria-pressed="${name === theme}">
            <span class="theme-pill-check" aria-hidden="true">${CHECK_SVG}</span>${esc(name)}
          </button>`
        ).join("")}
      </div>
    </div>
  `;
}

function nextLessonLinkHTML(lesson) {
  const idx = lessons.indexOf(lesson);
  const next = lessons[idx + 1];
  const available = next && !isLocked(next) ? next : null;
  return available
    ? `<a class="next" href="#/${available.id}"><span>Next</span>${available.title} →</a>`
    : `<a class="next" href="#/"><span>Done</span>Back to overview →</a>`;
}

function wireThemePills(lesson) {
  app.querySelectorAll("[data-theme]").forEach((btn) => {
    btn.addEventListener("click", () => {
      setSelectedTheme(lesson.id, btn.dataset.theme);
      renderLesson(lesson);
    });
  });
}

function wireMarkButton(lesson, btn) {
  btn.addEventListener("click", () => {
    const cur = selectedTheme(lesson.id);
    const nowDone = toggleTheme(lesson.id, cur);
    btn.textContent = nowDone ? "Completed ✓" : "Mark as completed";
    btn.classList.toggle("is-done", nowDone);
    const pill = app.querySelector('[data-theme="' + cur + '"]');
    if (pill) pill.classList.toggle("is-complete", nowDone);
  });
}

function renderLesson(lesson) {
  markSeen(lesson.id);
  if (lesson.kind === "vocab") renderVocabLesson(lesson);
  else renderGrammarLesson(lesson);
  window.scrollTo(0, 0);
}

/* ==================================================================
   Grammar lesson
   ================================================================== */

function renderGrammarLesson(lesson) {
  const theme = selectedTheme(lesson.id);
  const themeData = themeDataFor(lesson, theme);
  const done = themeDone(lesson.id, theme);
  const blocks = lesson.build(themeData, theme);

  app.innerHTML = `
    <a class="back" href="#/">← All lessons</a>

    <header class="lesson-head">
      <p class="eyebrow">Lesson ${lesson.number}</p>
      <h1>${lesson.title}</h1>
      <p>${esc(lesson.summary)}</p>
    </header>

    ${themeSwitcherHTML(lesson, theme)}

    ${blocks.map(renderBlock).join("")}

    <div class="lesson-foot">
      <button type="button" class="btn btn-primary ${done ? "is-done" : ""}" id="mark">
        ${done ? "Completed ✓" : "Mark as completed"}
      </button>
      ${nextLessonLinkHTML(lesson)}
    </div>
  `;

  wireThemePills(lesson);
  wireMarkButton(lesson, document.getElementById("mark"));
  wireExercises();
}

function renderBlock(block, i) {
  switch (block.type) {
    case "heading":
      return `<h2 class="block-heading">${block.text}</h2>`;

    case "prose":
      return `<p class="prose">${block.text}</p>`;

    case "note":
      return `<div class="note">${block.text}</div>`;

    case "rules":
      return `
        ${block.title ? `<p class="rules-title">${block.title}</p>` : ""}
        <ul class="rules">${block.items.map((x) => `<li>${x}</li>`).join("")}</ul>
      `;

    case "table":
      return `
        ${block.caption ? `<p class="table-caption">${block.caption}</p>` : ""}
        <div class="table-wrap">
          <table>
            <thead><tr>${block.headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
            <tbody>
              ${block.rows
                .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`)
                .join("")}
            </tbody>
          </table>
        </div>
      `;

    case "examples":
      return `
        <ul class="examples">
          ${block.items
            .map(
              ([sv, en]) =>
                `<li><span class="sv" lang="sv">${esc(sv)}</span><span class="en">${esc(
                  en
                )}</span></li>`
            )
            .join("")}
        </ul>
      `;

    case "exercise":
      return `
        <section class="exercise" data-exercise="${i}">
          <p class="exercise-label">Practice</p>
          <p class="exercise-instruction">${esc(block.instruction)}</p>
          ${block.items
            .map(
              (item, j) => `
            <div class="q" data-answer="${esc(item.answer)}">
              <label>
                <span class="q-prompt">${esc(item.q)}</span>
                ${item.hint ? `<span class="q-gloss">${esc(item.hint)}</span>` : ""}
                <span class="q-row">
                  <input type="text" autocomplete="off" autocapitalize="off"
                         spellcheck="false" lang="sv"
                         placeholder="Your answer" aria-label="Answer ${j + 1}">
                  <span class="verdict" aria-live="polite"></span>
                </span>
              </label>
              <p class="solution" hidden><span>Answer</span>${esc(item.answer)}</p>
            </div>`
            )
            .join("")}
          <div class="exercise-actions">
            <button type="button" class="btn" data-action="check">Check answers</button>
            <button type="button" class="btn" data-action="reveal">Show answers</button>
          </div>
        </section>
      `;

    default:
      return "";
  }
}

function wireExercises() {
  app.querySelectorAll(".exercise").forEach((box) => {
    const questions = [...box.querySelectorAll(".q")];

    box.querySelector('[data-action="check"]').addEventListener("click", () => {
      questions.forEach((q) => {
        const input = q.querySelector("input");
        const verdict = q.querySelector(".verdict");
        if (!input.value.trim()) {
          q.classList.remove("right", "wrong");
          verdict.textContent = "";
          return;
        }
        const ok = normalise(input.value) === normalise(q.dataset.answer);
        q.classList.toggle("right", ok);
        q.classList.toggle("wrong", !ok);
        verdict.textContent = ok ? "✓" : "✗";
        if (!ok) q.querySelector(".solution").hidden = false;
      });
    });

    box.querySelector('[data-action="reveal"]').addEventListener("click", () => {
      questions.forEach((q) => {
        q.querySelector(".solution").hidden = false;
      });
    });

    // Enter checks the whole set, so you can drill without reaching for the mouse.
    box.querySelectorAll("input").forEach((input) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          box.querySelector('[data-action="check"]').click();
        }
      });
    });
  });
}

/* ==================================================================
   Vocabulary lesson

   Two stages on one grid of square cards.

   1. Study — the front face shows Swedish over English. Tapping a card marks it
      studied; a bulk button marks the lot.
   2. Test  — once everything is studied the grid flips to its back face, which
      carries a *reshuffled* word list. Swapping words on the hidden face means
      the reorder is invisible mid-flip and reads as one smooth shuffle. An
      English prompt then asks you to pick the matching card.
   ================================================================== */

const FLIP_MS = 550;
const FLIP_STAGGER = 40;

function renderVocabLesson(lesson) {
  const theme = selectedTheme(lesson.id);
  const words = lesson.words(themeDataFor(lesson, theme));
  const done = themeDone(lesson.id, theme);

  // Three independent shuffles: study order, test order, and prompt order.
  const front = shuffle(words);
  const back = shuffle(words);
  const prompts = shuffle(words);

  app.innerHTML = `
    <a class="back" href="#/">← All lessons</a>

    <header class="lesson-head">
      <p class="eyebrow">Lesson ${lesson.number} · Vocabulary</p>
      <h1>${lesson.title}</h1>
      <p>${esc(lesson.summary)}</p>
    </header>

    ${themeSwitcherHTML(lesson, theme)}

    <div class="vocab-prompt" id="vocab-prompt" hidden>
      <span class="vocab-prompt-label">Which card means</span>
      <span class="vocab-prompt-word" id="vocab-prompt-word"></span>
      <span class="vocab-prompt-hint" id="vocab-prompt-hint"></span>
    </div>

    <div class="vocab-done" id="vocab-done" hidden>
      <h3>Deck cleared</h3>
      <p>Every word matched. Switch theme for a fresh deck, or head back to the overview.</p>
    </div>

    <div class="vocab-bar">
      <p class="vocab-status" id="vocab-status" aria-live="polite"></p>
      <button type="button" class="btn" id="vocab-all">Mark all as ready</button>
    </div>

    <ul class="vocab-grid" id="vocab-grid">
      ${front
        .map(
          (w, i) => `
        <li>
          <button type="button" class="vocab-card" data-i="${i}">
            <span class="vocab-inner">
              <span class="vocab-face vocab-front">
                <span class="vocab-tick" aria-hidden="true">${CHECK_SVG}</span>
                <span class="vocab-word" lang="sv">${esc(w.sv)}</span>
                <span class="vocab-gloss">${esc(w.en)}</span>
              </span>
              <span class="vocab-face vocab-back">
                <span class="vocab-word" lang="sv">${esc(back[i].sv)}</span>
              </span>
            </span>
          </button>
        </li>`
        )
        .join("")}
    </ul>

    <div class="lesson-foot">
      <button type="button" class="btn btn-primary ${done ? "is-done" : ""}" id="mark">
        ${done ? "Completed ✓" : "Mark as completed"}
      </button>
      ${nextLessonLinkHTML(lesson)}
    </div>
  `;

  wireThemePills(lesson);

  const cards = [...app.querySelectorAll(".vocab-card")];
  const statusEl = document.getElementById("vocab-status");
  const allBtn = document.getElementById("vocab-all");
  const promptBox = document.getElementById("vocab-prompt");
  const promptWord = document.getElementById("vocab-prompt-word");
  const promptHint = document.getElementById("vocab-prompt-hint");
  const doneBox = document.getElementById("vocab-done");
  const markBtn = document.getElementById("mark");

  wireMarkButton(lesson, markBtn);

  let stage = "study";
  const ready = new Set();
  let promptIndex = 0;

  function studyStatus() {
    statusEl.textContent = `${ready.size} of ${cards.length} studied — tap a card once you know it`;
  }

  function testStatus() {
    statusEl.textContent = `${promptIndex} of ${prompts.length} matched`;
  }

  function markReady(card) {
    const i = Number(card.dataset.i);
    if (ready.has(i)) return;
    ready.add(i);
    card.classList.add("is-ready");
    studyStatus();
    if (ready.size === cards.length) beginTest();
  }

  function beginTest() {
    stage = "flipping";
    allBtn.hidden = true;
    statusEl.textContent = "Flipping the deck…";

    // Stagger the flips so the grid turns over as a wave.
    cards.forEach((card, i) => {
      setTimeout(() => card.classList.add("is-flipped"), i * FLIP_STAGGER);
    });

    setTimeout(() => {
      stage = "test";
      cards.forEach((c) => c.classList.remove("is-ready"));
      promptBox.hidden = false;
      showPrompt();
    }, FLIP_MS + cards.length * FLIP_STAGGER);
  }

  function showPrompt() {
    promptWord.textContent = prompts[promptIndex].en;
    promptHint.textContent = "";
    promptBox.classList.remove("is-swap");
    testStatus();
  }

  function advance() {
    promptIndex += 1;
    if (promptIndex >= prompts.length) {
      finish();
      return;
    }
    // Brief fade so the next prompt doesn't just pop in.
    promptBox.classList.add("is-swap");
    setTimeout(showPrompt, 180);
  }

  function finish() {
    stage = "over";
    promptBox.hidden = true;
    doneBox.hidden = false;
    statusEl.textContent = `${prompts.length} of ${prompts.length} matched`;
    const cur = selectedTheme(lesson.id);
    if (setThemeDone(lesson.id, cur, true) === true) {
      markBtn.textContent = "Completed ✓";
      markBtn.classList.add("is-done");
      const pill = app.querySelector('[data-theme="' + cur + '"]');
      if (pill) pill.classList.add("is-complete");
    }
  }

  function guess(card) {
    if (card.classList.contains("is-cleared")) return;
    const word = back[Number(card.dataset.i)];

    if (word.sv === prompts[promptIndex].sv) {
      card.classList.add("is-hit");
      setTimeout(() => {
        card.classList.remove("is-hit");
        card.classList.add("is-cleared");
        advance();
      }, 220);
    } else {
      card.classList.add("is-miss");
      promptHint.textContent = `Not “${word.sv}” — that one means ${word.en}.`;
      setTimeout(() => card.classList.remove("is-miss"), 420);
    }
  }

  cards.forEach((card) => {
    card.addEventListener("click", () => {
      if (stage === "study") markReady(card);
      else if (stage === "test") guess(card);
    });
  });

  allBtn.addEventListener("click", () => {
    if (stage !== "study") return;
    cards.forEach((card, i) => setTimeout(() => markReady(card), i * 30));
  });

  studyStatus();
}

/* ==================================================================
   Router
   ================================================================== */

function route() {
  const id = location.hash.replace(/^#\/?/, "");
  const lesson = lessonById(id);
  if (lesson && !isLocked(lesson)) {
    document.title = `${lesson.title} · Swedish grammar`;
    renderLesson(lesson);
  } else {
    // Unknown or still-locked lesson falls back to the overview.
    document.title = "Swedish grammar for beginners";
    renderOverview();
  }
}

window.addEventListener("hashchange", route);
route();

  } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML =
      '<div class="boot-error"><h1>Something broke while loading</h1>' +
      '<p>Open the browser console for the details.</p><pre>' +
      String(err) + '</pre></div>';
  }
})();
    </script>

      </p>
