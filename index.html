<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swedish grammar for beginners</title>
    <meta
      name="description"
      content="Three beginner Swedish grammar lessons — nouns, verbs and adjectives — taught through Stardew Valley, Pokémon and bunnies."
    />
    <meta name="theme-color" content="#f0eee6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="wrap" id="app"></main>
    <script type="module" src="js/app.js"></script>
    <noscript>
      <p style="max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem">
        This app needs JavaScript to show the lessons. Turn it on and reload.
      </p>
    </noscript>
  </body>
</html>
